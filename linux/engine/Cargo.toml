[package]
name = "coco-engine"
description = "Coco's agent brain: talk to the local OpenCode service"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "coco_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros", "fs"] }
futures-util = "0.3"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
