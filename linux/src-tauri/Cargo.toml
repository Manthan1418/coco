[package]
name = "coco"
description = "Coco for Linux — the island at the top of your screen"
authors = ["Coco"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "coco_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Production builds enable this so Tauri serves the embedded assets instead of
# the Vite dev server. The Tauri CLI (`tauri build` / `npm run pack`) turns it on
# automatically; a *bare* `cargo build --release` does not, which silently
# yields a dev binary that loads http://localhost:1420 and shows a blank island
# unless Vite is running. If you build by hand, pass `--features custom-protocol`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "process", "macros"] }
# `stream` is what makes replies land word by word: Response::chunk() drives the
# SSE reader in claude.rs. Everything else stays off — rustls only, no TLS store.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Secrets: the freedesktop Secret Service (gnome-keyring / KWallet), the Linux
# counterpart of the Windows Credential Manager. `crypto-rust` keeps the item
# encryption off OpenSSL so nothing extra has to be on the user's box.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# Local time for the log and the hook backup stamps (was GetLocalTime).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# The island window: _NET_WM_WINDOW_TYPE and the global cursor. tao has no
# type-hint API, and under a tiling compositor a NORMAL window gets tiled
# instead of sitting at the top-centre — verified in spike/island_spike.py.
x11rb = { version = "0.13", features = ["shape"] }

# Reading our own X11 window id out of the Tauri window, for the above.
raw-window-handle = "0.6"

# The webview widget's own focus: X11 focus alone does not make WebKitGTK treat
# the document as focused, so the chat's text field could never be typed into.
gtk = { version = "0.18", features = ["v3_24"] }
